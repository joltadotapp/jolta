[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
kite-core = { path = "crates/core" }
uniffi = "=0.31.2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
