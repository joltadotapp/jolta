[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
kite-core = { path = "crates/core" }
uniffi = "=0.31.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
futures = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
keyring-core = "1.0.1"
apple-native-keyring-store = "1.0.2"
sha2 = "0.11"
hex = "0.4"
ammonia = "4.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"

[profile.release]
lto = "thin"
codegen-units = 4
