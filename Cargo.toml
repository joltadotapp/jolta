[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/cli", "crates/mcp-bridge", "crates/ai-helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
jolta-core = { path = "crates/core" }
uniffi = "=0.31.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs", "io-std", "process"] }
futures = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
mail-builder = "=2.0.0"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier", "hostname"] }
keyring-core = "1.0.1"
apple-native-keyring-store = "1.0.2"
sha2 = "0.11"
hex = "0.4"
ammonia = "4.2"
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
getrandom = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
calcard = { version = "=0.3.14", default-features = false }
rrule = "=0.14.0"
quick-xml = "0.42.0"

[profile.release]
lto = "thin"
codegen-units = 4

# llama-cpp-2 0.1.160 plus `with_lazy_mode`, so Gemma 4's per-layer embedding
# table stays on disk (docs/research/patches/llama-cpp-2-lazy-mode.patch), and
# without llama.cpp's `common` code.
[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-2" }
