# Test-only settings for the Dovecot container that scripts/test-servers.sh
# starts. Any user name logs in with the password in USER_PASSWORD, so each
# test gets its own empty mailbox by picking a new user name.

# The container sees connections from the Docker bridge, not localhost, and
# the test port has no TLS.
auth_allow_cleartext = yes

namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
